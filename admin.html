<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – TaxiData</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #e8f1f8; color: #1a365d; }
    header { background: #e8f1f8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d0e0ea; }
    header h1 { font-size: 18px; flex: 1; text-align: center; }
    button { background: white; border: 2px solid #1a365d; color: #1a365d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #content { padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; }
    .icon { background: white; border: 1px solid #cbd5e0; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; }
    .icon .emoji { font-size: 32px; margin-bottom: 8px; }
    .icon .label { font-size: 13px; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: white; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .breadcrumb span { cursor: pointer; color: #3182ce; }
    .breadcrumb .sep { color: #a0aec0; }
    .category-header { font-size: 20px; font-weight: 600; padding: 16px 16px 4px; }
    .period-display { font-size: 14px; color: #4a5568; padding: 0 16px 8px; }
    .controls { padding: 8px 16px; background: #f7fafc; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; }
    .controls select { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e0; }
    .controls button { padding: 8px 12px; }
    .section { background: white; border-radius: 12px; margin: 16px; }
    .section-header { font-size: 12px; font-weight: 600; color: #718096; padding: 8px 16px; background: #f7fafc; }
    .row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #edf2f7; cursor: pointer; }
    .row:hover { background: #f7fafc; }
    .row:last-child { border-bottom: none; }
    .row.expandable { cursor: pointer; }
    .row .expand-icon { margin-right: 8px; font-size: 12px; color: #718096; }
    .sub-row { padding-left: 32px; background: #f7fafc; }
    .sub-sub-row { padding-left: 48px; background: #edf2f7; }
    .driver-detail { padding-left: 64px; background: #e2e8f0; font-size: 13px; }
    .driver-detail .label { font-weight: 400; }
    .trip-row { padding-left: 64px; background: #f7fafc; font-size: 12px; }
    .detail-row { padding-left: 80px; background: #edf2f7; font-size: 12px; }
    .trip-detail { padding-left: 80px; background: #e2e8f0; font-size: 11px; }
    .row .label { flex: 1; font-weight: 500; }
    .row .value { font-weight: 600; }
    .row.total { background: #f7fafc; font-weight: 600; }
    .hidden { display: none !important; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: white; border-radius: 12px; padding: 16px; width: 90%; max-width: 320px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar .day { padding: 8px 4px; border-radius: 4px; cursor: pointer; }
    .calendar .day:hover { background: #e2e8f0; }
    .calendar .day.selected { background: #1a365d; color: white; }
    .calendar .day.in-range { background: #bee3f8; }
    .calendar .header { font-weight: 600; font-size: 12px; padding: 4px; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    .modal-buttons button { flex: 1; }
    .status { font-size: 11px; padding: 2px 6px; border-radius: 10px; margin-left: 8px; }
    .status-active { background: #c6f6d5; color: #276749; }
    .status-inactive { background: #fed7d7; color: #c53030; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #4a5568; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .form-group input:disabled, .form-group textarea:disabled, .form-group select:disabled { background: #edf2f7; color: #a0aec0; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .form-section { font-size: 14px; font-weight: 600; margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
    .info-box { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 12px; }
    .info-box h4 { margin-bottom: 8px; }
    .info-box ul { margin-left: 16px; }
    .info-box li { margin-bottom: 4px; }
    #access-denied { display: none; text-align: center; padding: 48px 16px; }
    #access-denied h2 { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="access-denied">
    <h2>Ingen behörighet</h2>
    <p>Du har inte tillgång till admin-panelen.</p>
    <button onclick="location.href='index.html'" style="margin-top:16px;">Tillbaka</button>
  </div>

  <div id="admin-app">
    <header>
      <button onclick="goHome()" style="font-size:20px;">🏠</button>
      <h1 id="title">Admin</h1>
      <button onclick="toggleProfile()" style="font-size:20px;">👤</button>
    </header>
    <div class="profile-menu" id="profile-menu" style="display:none; position:absolute; top:60px; right:16px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px; z-index:100;">
      <div onclick="location.href='index.html'" style="padding:8px; cursor:pointer;">Förarapp</div>
      <div onclick="logout()" style="padding:8px; cursor:pointer; color:#dc2626;">Logga ut</div>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="controls hidden" id="controls">
      <select id="category" onchange="changeCategory()">
        <option value="inkort">Inkört</option>
        <option value="timmar">Timmar</option>
        <option value="km">Km</option>
        <option value="chauffor">Chaufför</option>
        <option value="bil">Bil</option>
      </select>
      <button onclick="openDateModal()">📅</button>
    </div>
    <div id="content"></div>
  </div>

  <div class="modal hidden" id="date-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
        <button onclick="prevMonth()">‹</button>
        <span id="cal-title"></span>
        <button onclick="nextMonth()">›</button>
      </div>
      <div class="calendar" id="calendar"></div>
      <div class="modal-buttons">
        <button onclick="closeDateModal()">Avbryt</button>
        <button onclick="confirmDate()">OK</button>
      </div>
    </div>
  </div>

  <script>
    const APP_VERSION = '1.0.3';
    console.log('Admin version:', APP_VERSION);
    const SUPABASE_URL = 'https://lpfdryvukqmjlgenuzpb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7LwIOZ5ygRvJqJKFxl4cNQ_LvrzrHrP';

    const menu = [
      { id: 'akeridata', icon: '📊', label: 'Åkeridata' },
      { id: 'chaufforer', icon: '👥', label: 'Chaufförer' },
      { id: 'statistik', icon: '📈', label: 'Statistik' },
      { id: 'forarapp', icon: '🚗', label: 'Förarapp' }
    ];

    const catLabels = { inkort: 'Inkört', timmar: 'Timmar', km: 'Km', chauffor: 'Chaufför', bil: 'Bil' };
    const userCategories = { superadmin: 'Superadmin', agare: 'Ägare', admin: 'Admin', standard: 'Standard', semester: 'Semester', avslutad: 'Avslutad' };
    const catOrder = ['superadmin', 'agare', 'admin', 'standard', 'semester', 'avslutad'];
    const days = ['sö', 'må', 'ti', 'on', 'to', 'fr', 'lö'];
    const months = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

    let data = { trips: [], shifts: [] };
    let loadedMonths = {};
    let drivers = {};
    let path = JSON.parse(localStorage.getItem('admin_path') || '[]');
    let category = localStorage.getItem('admin_category') || 'inkort';
    let periodStart = new Date();
    periodStart.setDate(periodStart.getDate() - 1);
    let periodEnd = new Date();
    periodEnd.setDate(periodEnd.getDate() - 1);
    let tempStart = null;
    let tempEnd = null;
    let calMonth = new Date();
    let editingDriver = localStorage.getItem('admin_editing') || null;
    let currentUserId = localStorage.getItem('taxi_driver') || '';
    let expandedDays = {};
    let expandedCars = {};
    let expandedDrivers = {};
    let expandedCategories = {};
    let expandedTrips = {};

    function getMyCategory() {
      const me = drivers[currentUserId];
      return me ? me.category : '';
    }

    function isOwner() {
      return getMyCategory() === 'agare';
    }

    function isSuperAdmin() {
      return getMyCategory() === 'superadmin';
    }

    function hasAdminAccess() {
      const cat = getMyCategory();
      return cat === 'admin' || cat === 'agare' || cat === 'superadmin';
    }

    function canEditCategory(targetCat) {
      const myCat = getMyCategory();
      if (myCat === 'superadmin') return true;
      if (myCat === 'agare') return targetCat !== 'superadmin';
      if (myCat === 'admin') return ['standard', 'semester', 'avslutad'].includes(targetCat);
      return false;
    }

    function getAllowedCategories() {
      const myCat = getMyCategory();
      if (myCat === 'superadmin') return Object.entries(userCategories);
      if (myCat === 'agare') return Object.entries(userCategories).filter(([k]) => k !== 'superadmin');
      if (myCat === 'admin') return Object.entries(userCategories).filter(([k]) => ['standard', 'semester', 'avslutad'].includes(k));
      return [];
    }

    function maskValue(val) {
      if (!val) return '';
      return '••••••••';
    }

    function toYMD(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getMonthsInPeriod() {
      const months = [];
      const start = new Date(periodStart);
      const end = new Date(periodEnd);
      let current = new Date(start.getFullYear(), start.getMonth(), 1);
      while (current <= end) {
        const ym = current.getFullYear() + '-' + String(current.getMonth() + 1).padStart(2, '0');
        months.push(ym);
        current.setMonth(current.getMonth() + 1);
      }
      return months;
    }

    async function loadMonth(ym) {
      if (loadedMonths[ym]) return;
      try {
        const res = await fetch('data-' + ym + '.json?v=' + Date.now() + '&r=' + Math.random());
        if (res.ok) {
          const monthData = await res.json();
          loadedMonths[ym] = monthData;
        }
      } catch (e) {}
    }

    function mergeLoadedData() {
      data = { trips: [], shifts: [] };
      Object.values(loadedMonths).forEach(m => {
        if (m.trips) data.trips.push(...m.trips);
        if (m.shifts) data.shifts.push(...m.shifts);
      });
    }

    async function supabaseFetch(path, options = {}) {
      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      };
      if (options.headers) Object.assign(headers, options.headers);
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        method: options.method || 'GET',
        headers,
        body: options.body
      });
      if (!res.ok) throw new Error(await res.text());
      const text = await res.text();
      return text ? JSON.parse(text) : {};
    }

    async function loadData() {
      const monthsToLoad = getMonthsInPeriod();
      await Promise.all(monthsToLoad.map(loadMonth));
      mergeLoadedData();

      try {
        const rows = await supabaseFetch('drivers?select=*');
        drivers = {};
        if (Array.isArray(rows)) rows.forEach(r => { drivers[r.id] = r; });
      } catch (e) { console.error(e); }

      if (!hasAdminAccess()) {
        document.getElementById('access-denied').style.display = 'block';
        document.getElementById('admin-app').style.display = 'none';
        return;
      }
      document.getElementById('category').value = category;
      render();
    }

    function saveState() {
      localStorage.setItem('admin_path', JSON.stringify(path));
      localStorage.setItem('admin_category', category);
      localStorage.setItem('admin_editing', editingDriver || '');
    }

    function formatSEK(n) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(n || 0)) + ' kr';
    }

    function parseAmount(str) {
      return parseFloat((str || '0').replace(/\s/g, '').replace(',', '.')) || 0;
    }

    function formatDate(d) {
      return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
    }

    function getDisplayName(id) {
      const d = drivers[id];
      if (!d) return id;
      if (!isOwner()) return id;
      const first = d.first_name || '';
      const last = d.last_name || '';
      if (!first && !last) return id;
      if (!last) return first;
      return first + ' ' + last[0];
    }

    function inPeriod(dateStr) {
      if (!dateStr) return false;
      const ymd = dateStr.slice(0, 10);
      const startYMD = toYMD(periodStart);
      const endYMD = toYMD(periodEnd);
      return ymd >= startYMD && ymd <= endYMD;
    }

    function getTrips() {
      return (data.trips || []).filter(t => inPeriod(t.startdatum) && t.kredittyp !== '999');
    }

    function getAllDriverIds() {
      const ids = new Set();
      (data.shifts || []).forEach(s => { if (s.forar) ids.add(s.forar); });
      (data.trips || []).forEach(t => { if (t.forar) ids.add(t.forar); });
      Object.keys(drivers).forEach(id => ids.add(id));
      return Array.from(ids);
    }

    function getDriverStatus(id) {
      const d = drivers[id];
      if (!d || !d.activated) return 'inactive';
      if (d.expiry && new Date(d.expiry) > new Date()) return 'active';
      return 'inactive';
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      const back = document.getElementById('back');
      const controls = document.getElementById('controls');
      if (path.length === 0) {
        bc.innerHTML = '';
        back.classList.add('hidden');
        controls.classList.add('hidden');
        return;
      }
      back.classList.remove('hidden');
      controls.classList.toggle('hidden', path[0].id !== 'akeridata');
      let html = '<span onclick="goHome()">Hem</span>';
      path.forEach((p, i) => {
        html += '<span class="sep">›</span>';
        if (i < path.length - 1) {
          html += `<span onclick="goTo(${i})">${p.label}</span>`;
        } else {
          html += `<span>${p.label}</span>`;
        }
      });
      bc.innerHTML = html;
    }

    function openDateModal() {
      tempStart = new Date(periodStart);
      tempEnd = null;
      calMonth = new Date(periodStart);
      renderCalendar();
      document.getElementById('date-modal').classList.remove('hidden');
    }

    function closeDateModal() {
      document.getElementById('date-modal').classList.add('hidden');
    }

    async function confirmDate() {
      if (tempStart) {
        periodStart = tempStart;
        periodEnd = tempEnd || tempStart;
      }
      selectedDay = null;
      selectedCar = null;
      closeDateModal();
      await loadData();
    }

    function prevMonth() { calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(); }
    function nextMonth() { calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(); }

    function renderCalendar() {
      document.getElementById('cal-title').textContent = months[calMonth.getMonth()] + ' ' + calMonth.getFullYear();
      const cal = document.getElementById('calendar');
      const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
      const last = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
      let html = days.map(d => `<div class="header">${d}</div>`).join('');
      for (let i = 0; i < first.getDay(); i++) html += '<div></div>';
      for (let d = 1; d <= last.getDate(); d++) {
        const date = new Date(calMonth.getFullYear(), calMonth.getMonth(), d);
        const isStart = tempStart && date.toDateString() === tempStart.toDateString();
        const isEnd = tempEnd && date.toDateString() === tempEnd.toDateString();
        const inRange = tempStart && tempEnd && date > tempStart && date < tempEnd;
        const cls = isStart || isEnd ? 'selected' : inRange ? 'in-range' : '';
        html += `<div class="day ${cls}" onclick="selectDate(${d})">${d}</div>`;
      }
      cal.innerHTML = html;
    }

    function selectDate(d) {
      const date = new Date(calMonth.getFullYear(), calMonth.getMonth(), d);
      if (!tempStart || tempEnd) {
        tempStart = date;
        tempEnd = null;
      } else {
        if (date < tempStart) {
          tempEnd = tempStart;
          tempStart = date;
        } else {
          tempEnd = date;
        }
      }
      renderCalendar();
    }

    function changeCategory() {
      category = document.getElementById('category').value;
      selectedDay = null;
      selectedCar = null;
      saveState();
      render();
    }

    function toggleDay(ymd) {
      expandedDays[ymd] = !expandedDays[ymd];
      render();
    }

    function toggleCar(ymd, car) {
      const key = ymd + '_' + car;
      expandedCars[key] = !expandedCars[key];
      render();
    }

    function toggleDriver(ymd, car, driver) {
      const key = ymd + '_' + car + '_' + driver;
      expandedDrivers[key] = !expandedDrivers[key];
      render();
    }

    function toggleCategory(key) {
      expandedCategories[key] = !expandedCategories[key];
      render();
    }

    function toggleTrip(key) {
      expandedTrips[key] = !expandedTrips[key];
      render();
    }

    function render() {
      saveState();
      renderBreadcrumb();
      const content = document.getElementById('content');
      const title = document.getElementById('title');

      if (path.length === 0) {
        title.textContent = 'Admin';
        content.innerHTML = `<div class="grid">${menu.map(m => `
          <div class="icon" onclick="${m.id === 'forarapp' ? "location.href='index.html'" : "openMenu('" + m.id + "')"}">
            <div class="emoji">${m.icon}</div>
            <div class="label">${m.label}</div>
          </div>
        `).join('')}</div>`;
      } else if (path[0].id === 'akeridata') {
        title.textContent = 'Åkeridata';
        renderAkeridata(content);
      } else if (path[0].id === 'chaufforer') {
        if (editingDriver) {
          title.textContent = 'Redigera';
          renderEditDriver(content);
        } else {
          title.textContent = 'Chaufförer';
          renderChaufforer(content);
        }
      } else {
        title.textContent = path[0].label;
        content.innerHTML = '<div class="section"><p style="padding:16px;">Kommer snart</p></div>';
      }
    }

    function renderAkeridata(content) {
      renderDayList(content);
    }

    function renderDayList(content) {
      const trips = getTrips();
      const total = trips.reduce((s, t) => s + parseAmount(t.belopp), 0);
      const sameDay = toYMD(periodStart) === toYMD(periodEnd);
      const periodText = sameDay ? formatDate(periodStart) : formatDate(periodStart) + ' – ' + formatDate(periodEnd);

      const byDay = {};
      trips.forEach(t => {
        const ymd = (t.startdatum || '').slice(0, 10);
        if (!byDay[ymd]) byDay[ymd] = 0;
        byDay[ymd] += parseAmount(t.belopp);
      });

      let html = `<div class="category-header">${catLabels[category]}</div>`;
      html += `<div class="period-display">${periodText}</div>`;
      html += '<div class="section">';
      html += `<div class="row total"><span class="label">Totalt</span><span class="value">${formatSEK(total)}</span></div>`;
      Object.entries(byDay).sort().reverse().forEach(([date, amount]) => {
        const parts = date.split('-');
        const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        const isExpanded = expandedDays[date];
        const icon = isExpanded ? '−' : '+';
        html += `<div class="row expandable" onclick="toggleDay('${date}')"><span class="expand-icon">${icon}</span><span class="label">${formatDate(d)}</span><span class="value">${formatSEK(amount)}</span></div>`;
        
        if (isExpanded) {
          const dayTrips = trips.filter(t => (t.startdatum || '').slice(0, 10) === date);
          const byCar = {};
          dayTrips.forEach(t => {
            const car = t.taxi || 'Okänd';
            if (!byCar[car]) byCar[car] = { amount: 0, drivers: {} };
            byCar[car].amount += parseAmount(t.belopp);
            const driver = t.forar || 'Okänd';
            if (!byCar[car].drivers[driver]) byCar[car].drivers[driver] = 0;
            byCar[car].drivers[driver] += parseAmount(t.belopp);
          });
          
          Object.entries(byCar).sort((a, b) => b[1].amount - a[1].amount).forEach(([car, data]) => {
            const carKey = date + '_' + car;
            const carExpanded = expandedCars[carKey];
            const carIcon = carExpanded ? '−' : '+';
            html += `<div class="row sub-row expandable" onclick="event.stopPropagation();toggleCar('${date}','${car}')"><span class="expand-icon">${carIcon}</span><span class="label">${car}</span><span class="value">${formatSEK(data.amount)}</span></div>`;
            
            if (carExpanded) {
              Object.entries(data.drivers).sort((a, b) => b[1] - a[1]).forEach(([driver, driverAmount]) => {
                const driverKey = date + '_' + car + '_' + driver;
                const driverExpanded = expandedDrivers[driverKey];
                const driverIcon = driverExpanded ? '−' : '+';
                html += `<div class="row sub-sub-row expandable" onclick="event.stopPropagation();toggleDriver('${date}','${car}','${driver}')"><span class="expand-icon">${driverIcon}</span><span class="label">${getDisplayName(driver)}</span><span class="value">${formatSEK(driverAmount)}</span></div>`;
                
                if (driverExpanded) {
                  const driverTrips = dayTrips.filter(t => t.taxi === car && t.forar === driver);
                  const tripCount = driverTrips.length;
                  const krPerTrip = tripCount > 0 ? driverAmount / tripCount : 0;
                  
                  // Find shift for this driver/car/day
                  const shift = (data.shifts || []).find(s => {
                    if (s.forar !== driver || s.taxi !== car) return false;
                    const startStr = (s.start || '').replace(/\s/g, ' ');
                    const slutStr = (s.slut || '').replace(/\s/g, ' ');
                    const startDate = startStr.slice(0, 4) + '-' + startStr.slice(4, 6) + '-' + startStr.slice(6, 8);
                    const slutDate = slutStr.slice(0, 4) + '-' + slutStr.slice(4, 6) + '-' + slutStr.slice(6, 8);
                    return date >= startDate && date <= slutDate;
                  });
                  
                  const hours = shift ? parseFloat((shift.tid || '0').replace(':', '.')) : 0;
                  const km = shift ? parseFloat((shift.km || '0').replace(',', '.')) : 0;
                  const krPerHour = hours > 0 ? driverAmount / hours : 0;
                  const krPerMil = km > 0 ? driverAmount / (km / 10) : 0;
                  
                  // Arbetade timmar
                  const hoursKey = driverKey + '_hours';
                  const hoursExpanded = expandedCategories[hoursKey];
                  html += `<div class="row detail-row expandable" onclick="event.stopPropagation();toggleCategory('${hoursKey}')"><span class="expand-icon">${hoursExpanded ? '−' : '+'}</span><span class="label">Arbetade timmar</span><span class="value">${hours.toFixed(1)} tim</span></div>`;
                  if (hoursExpanded && shift) {
                    html += `<div class="row trip-detail"><span class="label">Start</span><span class="value">${(shift.start || '').slice(9)}</span></div>`;
                    html += `<div class="row trip-detail"><span class="label">Slut</span><span class="value">${(shift.slut || '').slice(9)}</span></div>`;
                    html += `<div class="row trip-detail"><span class="label">Kr/timme</span><span class="value">${formatSEK(krPerHour)}</span></div>`;
                  }
                  
                  // Körda km
                  const kmKey = driverKey + '_km';
                  const kmExpanded = expandedCategories[kmKey];
                  html += `<div class="row detail-row expandable" onclick="event.stopPropagation();toggleCategory('${kmKey}')"><span class="expand-icon">${kmExpanded ? '−' : '+'}</span><span class="label">Körda km</span><span class="value">${km.toFixed(1)} km</span></div>`;
                  if (kmExpanded) {
                    html += `<div class="row trip-detail"><span class="label">Kr/mil</span><span class="value">${formatSEK(krPerMil)}</span></div>`;
                  }
                  
                  // Antal körningar
                  const tripsKey = driverKey + '_trips';
                  const tripsExpanded = expandedCategories[tripsKey];
                  html += `<div class="row detail-row expandable" onclick="event.stopPropagation();toggleCategory('${tripsKey}')"><span class="expand-icon">${tripsExpanded ? '−' : '+'}</span><span class="label">Antal körningar</span><span class="value">${tripCount} st</span></div>`;
                  if (tripsExpanded) {
                    html += `<div class="row trip-detail"><span class="label">Kr/körning</span><span class="value">${formatSEK(krPerTrip)}</span></div>`;
                  }
                  
                  // Kvitton
                  const kvittonKey = driverKey + '_kvitton';
                  const kvittonExpanded = expandedCategories[kvittonKey];
                  html += `<div class="row detail-row expandable" onclick="event.stopPropagation();toggleCategory('${kvittonKey}')"><span class="expand-icon">${kvittonExpanded ? '−' : '+'}</span><span class="label">Kvitton</span><span class="value">${tripCount} st</span></div>`;
                  if (kvittonExpanded) {
                    driverTrips.sort((a, b) => (a.kvittonr || '').localeCompare(b.kvittonr || '')).forEach(t => {
                      const tripKey = driverKey + '_' + t.kvittonr;
                      const tripExpanded = expandedTrips[tripKey];
                      html += `<div class="row trip-row expandable" onclick="event.stopPropagation();toggleTrip('${tripKey}')"><span class="expand-icon">${tripExpanded ? '−' : '+'}</span><span class="label">${t.kvittonr || '-'}</span><span class="value">${formatSEK(parseAmount(t.belopp))}</span></div>`;
                      if (tripExpanded) {
                        html += `<div class="row trip-detail"><span class="label">Start</span><span class="value">${t.starttid || '-'} ${t.startzon || ''}</span></div>`;
                        html += `<div class="row trip-detail"><span class="label">Slut</span><span class="value">${t.sluttid || '-'} ${t.slutzon || ''}</span></div>`;
                        html += `<div class="row trip-detail"><span class="label">Betalt</span><span class="value">${formatSEK(parseAmount(t.belopp))}</span></div>`;
                      }
                    });
                  }
                }
              });
            }
          });
        }
      });
      if (unknown.length > 0) {
        html += `<div class="section-header">Övriga</div>`;
        unknown.sort().forEach(id => {
          const status = getDriverStatus(id);
          const statusLabel = status === 'active' ? 'Aktiv' : 'Inaktiv';
          const displayName = getDisplayName(id);
          html += `<div class="row" onclick="editDriver('${id}')">
            <span class="label">${displayName}</span>
            <span class="status status-${status}">${statusLabel}</span>
          </div>`;
        });
      }
      html += '</div>';
      content.innerHTML = html;
    }

    function renderDayCars(content) {
      const trips = getTrips().filter(t => (t.startdatum || '').slice(0, 10) === selectedDay);

      const byCar = {};
      trips.forEach(t => {
        const car = t.taxi || 'Okänd';
        if (!byCar[car]) byCar[car] = 0;
        byCar[car] += parseAmount(t.belopp);
      });

      const parts = selectedDay.split('-');
      const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      const total = Object.values(byCar).reduce((s, a) => s + a, 0);

      let html = `<div class="category-header">${catLabels[category]}</div>`;
      html += `<div class="period-display">${formatDate(d)}</div>`;
      html += '<div class="section">';
      html += `<div class="row total"><span class="label">Totalt</span><span class="value">${formatSEK(total)}</span></div>`;
      Object.entries(byCar).sort((a, b) => b[1] - a[1]).forEach(([car, amount]) => {
        html += `<div class="row" onclick="selectCar('${car}')"><span class="label">${car}</span><span class="value">${formatSEK(amount)}</span></div>`;
      });
      html += '</div>';
      html += '<button onclick="selectedDay=null;render()" style="margin:16px;">← Tillbaka</button>';
      content.innerHTML = html;
    }

    function renderCarDrivers(content) {
      const trips = getTrips().filter(t => {
        if ((t.startdatum || '').slice(0, 10) !== selectedDay) return false;
        return t.taxi === selectedCar;
      });

      const byDriver = {};
      trips.forEach(t => {
        if (!byDriver[t.forar]) byDriver[t.forar] = 0;
        byDriver[t.forar] += parseAmount(t.belopp);
      });

      const total = Object.values(byDriver).reduce((s, a) => s + a, 0);

      let html = `<div class="category-header">${selectedCar}</div>`;
      html += `<div class="period-display">${selectedDay}</div>`;
      html += '<div class="section">';
      html += `<div class="row total"><span class="label">Totalt</span><span class="value">${formatSEK(total)}</span></div>`;
      Object.entries(byDriver).sort((a, b) => b[1] - a[1]).forEach(([driver, amount]) => {
        const name = getDisplayName(driver);
        html += `<div class="row"><span class="label">${name}</span><span class="value">${formatSEK(amount)}</span></div>`;
      });
      html += '</div>';
      html += '<button onclick="selectedCar=null;render()" style="margin:16px;">← Tillbaka</button>';
      content.innerHTML = html;
    }

    function renderChaufforer(content) {
      const ids = getAllDriverIds();
      const grouped = {};
      const unknown = [];
      ids.forEach(id => {
        const cat = drivers[id]?.category || 'standard';
        if (!catOrder.includes(cat)) {
          unknown.push(id);
        } else {
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(id);
        }
      });

      let html = '<div class="section">';
      catOrder.forEach(cat => {
        if (!grouped[cat] || grouped[cat].length === 0) return;
        html += `<div class="section-header">${userCategories[cat]}</div>`;
        grouped[cat].sort().forEach(id => {
          const status = getDriverStatus(id);
          const statusLabel = status === 'active' ? 'Aktiv' : 'Inaktiv';
          const displayName = getDisplayName(id);
          html += `<div class="row" onclick="editDriver('${id}')">
            <span class="label">${displayName}</span>
            <span class="status status-${status}">${statusLabel}</span>
          </div>`;
        });
      });
      if (unknown.length > 0) {
        html += `<div class="section-header">Övriga</div>`;
        unknown.sort().forEach(id => {
          const status = getDriverStatus(id);
          const statusLabel = status === 'active' ? 'Aktiv' : 'Inaktiv';
          const displayName = getDisplayName(id);
          html += `<div class="row" onclick="editDriver('${id}')">
            <span class="label">${displayName}</span>
            <span class="status status-${status}">${statusLabel}</span>
          </div>`;
        });
      }
      html += '</div>';
      content.innerHTML = html;
    }

    function renderEditDriver(content) {
      const d = drivers[editingDriver] || {};
      const owner = isOwner();
      const targetCat = d.category || 'standard';
      const canEdit = canEditCategory(targetCat);
      const personalDisabled = owner ? '' : 'disabled';
      const catDisabled = canEdit ? '' : 'disabled';
      const v = (val) => owner ? (val || '') : maskValue(val);
      const allowedCats = getAllowedCategories();

      content.innerHTML = `<div class="section" style="padding:16px;">
        <div class="form-row">
          <div class="form-group"><label>Förnamn</label><input id="f-first-name" value="${v(d.first_name)}" ${personalDisabled}></div>
          <div class="form-group"><label>Efternamn</label><input id="f-last-name" value="${v(d.last_name)}" ${personalDisabled}></div>
        </div>
        <div class="form-group"><label>Adress</label><input id="f-address" value="${v(d.address)}" ${personalDisabled}></div>
        <div class="form-row">
          <div class="form-group"><label>Postnummer</label><input id="f-postal" value="${v(d.postal_code)}" ${personalDisabled}></div>
          <div class="form-group"><label>Ort</label><input id="f-city" value="${v(d.city)}" ${personalDisabled}></div>
        </div>
        <div class="form-group"><label>E-post</label><input id="f-email" type="email" value="${v(d.email)}" ${personalDisabled}></div>
        <div class="form-group"><label>Telefon</label><input id="f-phone" value="${v(d.phone)}" ${personalDisabled}></div>
        
        <div class="form-section">Närmast anhörig</div>
        <div class="form-row">
          <div class="form-group"><label>Förnamn</label><input id="f-emergency-first" value="${v(d.emergency_first_name)}" ${personalDisabled}></div>
          <div class="form-group"><label>Efternamn</label><input id="f-emergency-last" value="${v(d.emergency_last_name)}" ${personalDisabled}></div>
        </div>
        <div class="form-group"><label>Adress</label><input id="f-emergency-address" value="${v(d.emergency_address)}" ${personalDisabled}></div>
        <div class="form-row">
          <div class="form-group"><label>Postnummer</label><input id="f-emergency-postal" value="${v(d.emergency_postal)}" ${personalDisabled}></div>
          <div class="form-group"><label>Ort</label><input id="f-emergency-city" value="${v(d.emergency_city)}" ${personalDisabled}></div>
        </div>
        <div class="form-group"><label>Telefon</label><input id="f-emergency-phone" value="${v(d.emergency_phone)}" ${personalDisabled}></div>
        <div class="form-group"><label>Relation</label><input id="f-emergency-relation" value="${v(d.emergency_relation)}" ${personalDisabled}></div>
        
        <div class="form-section">Övrigt</div>
        <div class="form-group"><label>Kategori</label>
          <select id="f-category" ${catDisabled}>
            ${allowedCats.map(([k, v]) => `<option value="${k}" ${targetCat === k ? 'selected' : ''}>${v}</option>`).join('')}
            ${!allowedCats.find(([k]) => k === targetCat) ? `<option value="${targetCat}" selected>${userCategories[targetCat] || targetCat}</option>` : ''}
          </select>
        </div>
        <div class="form-group"><label>Anteckningar</label><textarea id="f-notes" ${personalDisabled}>${owner ? (d.notes || '') : maskValue(d.notes)}</textarea></div>
        
        <div class="info-box">
          <h4>Rättigheter</h4>
          <ul>
            <li><b>Avslutad:</b> Kan ej logga in. Data används för statistik.</li>
            <li><b>Semester:</b> Kan logga in, se data. Inga notiser.</li>
            <li><b>Standard:</b> All data, statistik, kommunikation, notiser.</li>
            <li><b>Admin:</b> Aktivera/avaktivera, ändra kategori på lägre. Ser ej personlig data.</li>
            <li><b>Ägare:</b> Allt + redigera personlig information.</li>
            <li><b>Superadmin:</b> Kan ändra alla kategorier. Ser ej personlig data.</li>
          </ul>
        </div>
        
        ${owner || canEdit ? `<button onclick="saveDriver()" style="width:100%; margin-top:16px;">Spara</button>` : ''}
        <div style="margin-top:16px; display:flex; gap:8px;">
          <button onclick="activateDriver('${editingDriver}')" style="flex:1;">Aktivera</button>
          <button onclick="deactivateDriver('${editingDriver}')" style="flex:1;">Avaktivera</button>
          <button onclick="shareDriver('${editingDriver}')" style="flex:1;">Dela</button>
        </div>
      </div>`;
    }

    function editDriver(id) {
      editingDriver = id;
      render();
    }

    async function saveDriver() {
      const d = drivers[editingDriver] || {};
      const owner = isOwner();
      const canEdit = canEditCategory(d.category || 'standard');
      if (!owner && !canEdit) return;

      const driverData = { id: editingDriver };
      if (owner) {
        driverData.first_name = document.getElementById('f-first-name').value;
        driverData.last_name = document.getElementById('f-last-name').value;
        driverData.address = document.getElementById('f-address').value;
        driverData.postal_code = document.getElementById('f-postal').value;
        driverData.city = document.getElementById('f-city').value;
        driverData.email = document.getElementById('f-email').value;
        driverData.phone = document.getElementById('f-phone').value;
        driverData.emergency_first_name = document.getElementById('f-emergency-first').value;
        driverData.emergency_last_name = document.getElementById('f-emergency-last').value;
        driverData.emergency_address = document.getElementById('f-emergency-address').value;
        driverData.emergency_postal = document.getElementById('f-emergency-postal').value;
        driverData.emergency_city = document.getElementById('f-emergency-city').value;
        driverData.emergency_phone = document.getElementById('f-emergency-phone').value;
        driverData.emergency_relation = document.getElementById('f-emergency-relation').value;
        driverData.notes = document.getElementById('f-notes').value;
      }
      if (canEdit) {
        driverData.category = document.getElementById('f-category').value;
      }

      try {
        await supabaseFetch('drivers', {
          method: 'POST',
          body: JSON.stringify(driverData),
          headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
        });
        drivers[editingDriver] = { ...drivers[editingDriver], ...driverData };
        alert('Sparat!');
        editingDriver = null;
        render();
      } catch (e) {
        alert('Fel: ' + e.message);
      }
    }

    function generatePassword() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let pw = '';
      for (let i = 0; i < 6; i++) pw += chars[Math.floor(Math.random() * chars.length)];
      return pw;
    }

    async function activateDriver(id) {
      const choice = prompt('Lösenord:\n1 = Autogenerera\nEller skriv eget lösenord:');
      if (choice === null) return;
      const pw = (choice === '1' || choice === '') ? generatePassword() : choice;
      const expiry = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
      try {
        await supabaseFetch('drivers', {
          method: 'POST',
          body: JSON.stringify({ id, password: pw, expiry, activated: true, logged_in: false }),
          headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
        });
        drivers[id] = { ...drivers[id], id, password: pw, expiry, activated: true };
        alert('Aktiverad!\nLösenord: ' + pw);
        render();
      } catch (e) {
        alert('Fel: ' + e.message);
      }
    }

    function shareDriver(id) {
      const d = drivers[id];
      if (!d || !d.password) {
        alert('Ingen aktivering att dela');
        return;
      }
      const link = 'https://chrispypie.github.io/taxi-goteborg-data/';
      const msg = 'TaxiData\n\nLänk: ' + link + '\nFörar-ID: ' + id + '\nLösenord: ' + d.password + '\n\nLogga in inom 24 timmar.';
      if (navigator.share) {
        navigator.share({ title: 'TaxiData', text: msg }).catch(() => {});
      } else {
        alert(msg);
      }
    }

    async function deactivateDriver(id) {
      if (!confirm('Avaktivera ' + id + '?')) return;
      try {
        await supabaseFetch('drivers', {
          method: 'POST',
          body: JSON.stringify({ id, activated: false }),
          headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
        });
        if (drivers[id]) drivers[id].activated = false;
        render();
      } catch (e) {
        alert('Fel: ' + e.message);
      }
    }

    function openMenu(id) {
      const item = menu.find(m => m.id === id);
      path = [{ id, label: item.label }];
      editingDriver = null;
      selectedDay = null;
      selectedCar = null;
      render();
    }

    function goBack() {
      if (selectedCar) {
        selectedCar = null;
      } else if (selectedDay) {
        selectedDay = null;
      } else if (editingDriver) {
        editingDriver = null;
      } else {
        path.pop();
      }
      render();
    }

    function toggleProfile() {
      const menu = document.getElementById('profile-menu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function logout() {
      localStorage.removeItem('driver_id');
      localStorage.removeItem('driver_password');
      location.href = 'index.html';
    }
    function goHome() {
      path = [];
      editingDriver = null;
      selectedDay = null;
      selectedCar = null;
      render();
    }

    function goTo(index) {
      path = path.slice(0, index + 1);
      editingDriver = null;
      selectedDay = null;
      selectedCar = null;
      render();
    }

    loadData();
  </script>
</body>
</html>
