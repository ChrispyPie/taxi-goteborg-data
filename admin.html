<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – TaxiData</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #e8f1f8; color: #1a365d; }
    header { background: #e8f1f8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d0e0ea; }
    header h1 { font-size: 18px; flex: 1; text-align: center; }
    button { background: white; border: 2px solid #1a365d; color: #1a365d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #content { padding: 16px; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: white; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .breadcrumb span { cursor: pointer; color: #3182ce; }
    .breadcrumb span:hover { text-decoration: underline; }
    .breadcrumb .sep { color: #a0aec0; }
    .period { padding: 8px 16px; background: #f7fafc; border-bottom: 1px solid #e2e8f0; }
    .period button { background: white; }
    .section { background: white; border-radius: 12px; margin: 16px; }
    .row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #edf2f7; cursor: pointer; }
    .row:hover { background: #f7fafc; }
    .row:last-child { border-bottom: none; }
    .row .label { flex: 1; font-weight: 500; }
    .row .value { font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <button id="back" class="hidden" onclick="goBack()">←</button>
    <h1 id="title">Åkeridata</h1>
    <button onclick="location.href='index.html'">🏠</button>
  </header>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="period">
    <button id="period-btn" onclick="editPeriod()">Välj period</button>
  </div>
  <div id="content"></div>

  <script>
    let data = {};
    let path = [];
    let periodStart = new Date();
    let periodEnd = new Date();
    periodStart.setDate(periodStart.getDate() - 7);

    async function loadData() {
      const res = await fetch('data.json?t=' + Date.now());
      data = await res.json();
      render();
    }

    function formatSEK(n) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(n || 0)) + ' kr';
    }

    function parseAmount(str) {
      return parseFloat((str || '0').replace(/\s/g, '').replace(',', '.')) || 0;
    }

    function parseTime(tid) {
      if (!tid) return 0;
      const parts = tid.split(':');
      return parseInt(parts[0]) * 60 + parseInt(parts[1] || 0);
    }

    function formatTime(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h + ':' + String(m).padStart(2, '0');
    }

    function inPeriod(dateStr) {
      if (!dateStr) return false;
      const d = dateStr.replace(/\s/g, '').slice(0, 8);
      const ymd = d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8);
      const date = new Date(ymd);
      return date >= periodStart && date <= periodEnd;
    }

    function getShifts() {
      return (data.shifts || []).filter(s => inPeriod(s.start));
    }

    function getTrips() {
      return (data.trips || []).filter(t => inPeriod(t.startdatum));
    }

    function getStats() {
      const shifts = getShifts();
      const trips = getTrips().filter(t => t.kredittyp !== '999');
      const inkort = trips.reduce((s, t) => s + parseAmount(t.belopp), 0);
      const timmar = shifts.reduce((s, sh) => s + parseTime(sh.tid), 0);
      const km = trips.reduce((s, t) => s + parseAmount(t.kilometer), 0);
      return { inkort, timmar, km, shifts, trips };
    }

    function getCars() {
      const cars = {};
      getShifts().forEach(s => {
        const car = s.taxi || 'Okänd';
        if (!cars[car]) cars[car] = { shifts: [], trips: [] };
        cars[car].shifts.push(s);
      });
      getTrips().forEach(t => {
        const shift = getShifts().find(s => s.forar === t.forar && inPeriod(s.start));
        const car = shift?.taxi || 'Okänd';
        if (!cars[car]) cars[car] = { shifts: [], trips: [] };
        if (t.kredittyp !== '999') cars[car].trips.push(t);
      });
      return cars;
    }

    function getDriversForCar(car) {
      const cars = getCars();
      const drivers = {};
      (cars[car]?.shifts || []).forEach(s => {
        const id = s.forar;
        if (!drivers[id]) drivers[id] = { shifts: [], trips: [] };
        drivers[id].shifts.push(s);
      });
      (cars[car]?.trips || []).forEach(t => {
        const id = t.forar;
        if (!drivers[id]) drivers[id] = { shifts: [], trips: [] };
        drivers[id].trips.push(t);
      });
      return drivers;
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      const back = document.getElementById('back');
      if (path.length === 0) {
        bc.innerHTML = '';
        back.classList.add('hidden');
        return;
      }
      back.classList.remove('hidden');
      let html = '<span onclick="goHome()">Hem</span>';
      path.forEach((p, i) => {
        html += '<span class="sep">›</span>';
        if (i < path.length - 1) {
          html += `<span onclick="goTo(${i})">${p.label}</span>`;
        } else {
          html += `<span>${p.label}</span>`;
        }
      });
      bc.innerHTML = html;
    }

    function renderPeriod() {
      const btn = document.getElementById('period-btn');
      const fmt = d => d.toISOString().slice(2, 10).replace(/-/g, '');
      btn.textContent = fmt(periodStart) + '-' + fmt(periodEnd);
    }

    function render() {
      renderBreadcrumb();
      renderPeriod();
      const content = document.getElementById('content');
      const title = document.getElementById('title');

      if (path.length === 0) {
        title.textContent = 'Åkeridata';
        const stats = getStats();
        content.innerHTML = `<div class="section">
          <div class="row" onclick="openCat('inkort', 'Inkört')"><span class="label">Inkört</span><span class="value">${formatSEK(stats.inkort)}</span></div>
          <div class="row" onclick="openCat('timmar', 'Timmar')"><span class="label">Arbetade timmar</span><span class="value">${formatTime(stats.timmar)}</span></div>
          <div class="row" onclick="openCat('km', 'Km')"><span class="label">Körda km</span><span class="value">${stats.km.toFixed(1)} km</span></div>
        </div>`;
      } else if (path.length === 1) {
        const cat = path[0].id;
        title.textContent = path[0].label;
        const cars = getCars();
        let html = '<div class="section">';
        Object.entries(cars).sort().forEach(([car, data]) => {
          let val = '';
          if (cat === 'inkort') val = formatSEK(data.trips.reduce((s, t) => s + parseAmount(t.belopp), 0));
          else if (cat === 'timmar') val = formatTime(data.shifts.reduce((s, sh) => s + parseTime(sh.tid), 0));
          else val = data.trips.reduce((s, t) => s + parseAmount(t.kilometer), 0).toFixed(1) + ' km';
          html += `<div class="row" onclick="openCar('${car}')"><span class="label">${car}</span><span class="value">${val}</span></div>`;
        });
        html += '</div>';
        content.innerHTML = html;
      } else if (path.length === 2) {
        const car = path[1].id;
        const cat = path[0].id;
        title.textContent = car;
        const drivers = getDriversForCar(car);
        let html = '<div class="section">';
        Object.entries(drivers).sort().forEach(([id, data]) => {
          let val = '';
          if (cat === 'inkort') val = formatSEK(data.trips.reduce((s, t) => s + parseAmount(t.belopp), 0));
          else if (cat === 'timmar') val = formatTime(data.shifts.reduce((s, sh) => s + parseTime(sh.tid), 0));
          else val = data.trips.reduce((s, t) => s + parseAmount(t.kilometer), 0).toFixed(1) + ' km';
          html += `<div class="row" onclick="openDriver('${id}')"><span class="label">${id}</span><span class="value">${val}</span></div>`;
        });
        html += '</div>';
        content.innerHTML = html;
      } else if (path.length === 3) {
        const driverId = path[2].id;
        const cat = path[0].id;
        title.textContent = driverId;
        const cars = getCars();
        const car = path[1].id;
        const drivers = getDriversForCar(car);
        const driverData = drivers[driverId] || { shifts: [], trips: [] };
        let html = '<div class="section">';
        if (cat === 'inkort') {
          driverData.trips.forEach(t => {
            html += `<div class="row"><span class="label">${t.kvittonr}</span><span class="value">${formatSEK(parseAmount(t.belopp))}</span></div>`;
          });
        } else if (cat === 'timmar') {
          driverData.shifts.forEach(s => {
            const start = (s.start || '').split(' ')[1] || '';
            const slut = (s.slut || '').split(' ')[1] || '';
            html += `<div class="row"><span class="label">${start} – ${slut}</span><span class="value">${s.tid}</span></div>`;
          });
        } else {
          driverData.trips.forEach(t => {
            html += `<div class="row"><span class="label">${t.kvittonr}</span><span class="value">${parseAmount(t.kilometer).toFixed(1)} km</span></div>`;
          });
        }
        html += '</div>';
        content.innerHTML = html;
      }
    }

    function openCat(id, label) {
      path = [{ id, label }];
      render();
    }

    function openCar(car) {
      path.push({ id: car, label: car });
      render();
    }

    function openDriver(id) {
      path.push({ id, label: id });
      render();
    }

    function goBack() {
      path.pop();
      render();
    }

    function goHome() {
      path = [];
      render();
    }

    function goTo(index) {
      path = path.slice(0, index + 1);
      render();
    }

    function editPeriod() {
      const start = prompt('Startdatum (YYYY-MM-DD):', periodStart.toISOString().slice(0, 10));
      if (!start) return;
      const end = prompt('Slutdatum (YYYY-MM-DD):', periodEnd.toISOString().slice(0, 10));
      if (!end) return;
      periodStart = new Date(start);
      periodEnd = new Date(end);
      render();
    }

    loadData();
  </script>
</body>
</html>
