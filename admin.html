<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – TaxiData</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #e8f1f8; color: #1a365d; }
    header { background: #e8f1f8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d0e0ea; }
    header h1 { font-size: 18px; flex: 1; }
    button { background: white; border: 2px solid #1a365d; color: #1a365d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1a365d; color: white; }
    button.active { background: #1a365d; color: white; }
    #content { padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; }
    .icon { background: white; border: 1px solid #cbd5e0; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; }
    .icon:hover { border-color: #1a365d; }
    .icon .emoji { font-size: 32px; margin-bottom: 8px; }
    .icon .label { font-size: 13px; }
    .list-item { background: white; border: 1px solid #cbd5e0; border-radius: 4px; margin-bottom: 4px; }
    .list-row { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .list-row:hover { background: #f7fafc; }
    .hidden { display: none; }
    .section { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .driver-row { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; gap: 8px; }
    .driver-id { font-weight: 600; }
    .driver-name { color: #4a5568; }
    .driver-status { font-size: 11px; padding: 2px 6px; border-radius: 10px; }
    .status-active { background: #c6f6d5; color: #276749; }
    .status-inactive { background: #fed7d7; color: #c53030; }
    .status-pending { background: #fefcbf; color: #975a16; }
    .cat-normal { }
    .cat-semester { background: #e9d8fd; }
    .cat-avslutad { background: #e2e8f0; opacity: 0.7; }
    .cat-admin { background: #bee3f8; }
    .cat-agare { background: #fbd38d; }
    .btn-small { padding: 4px 8px; font-size: 12px; }
    .password-box { background: #f7fafc; padding: 16px; border-radius: 8px; text-align: center; }
    .password-box code { font-size: 24px; font-weight: 700; letter-spacing: 4px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #4a5568; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .section-header { font-size: 12px; font-weight: 600; color: #718096; padding: 8px 12px; background: #f7fafc; margin-top: 16px; }
    .data-btns { display: flex; gap: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header>
    <button id="back" class="hidden">←</button>
    <button id="home">🏠</button>
    <h1 id="title">Admin</h1>
    <button id="toggle-view">Ikoner</button>
  </header>
  <div id="content"></div>
  <input type="file" id="import-file" accept=".json" class="hidden">

  <script>
    const menu = [
      { id: 'oversikt', icon: '📊', label: 'Översikt' },
      { id: 'chaufforer', icon: '👥', label: 'Chaufförer' },
      { id: 'statistik', icon: '📈', label: 'Statistik' },
      { id: 'data', icon: '💾', label: 'Data' }
    ];

    const categories = {
      agare: 'Ägare',
      admin: 'Admin',
      normal: 'Normal',
      semester: 'Semester',
      avslutad: 'Avslutad'
    };

    let view = localStorage.getItem('admin_view') || 'grid';
    let current = null;
    let data = {};
    let drivers = {};
    let selectedDriver = null;
    let tempPassword = null;

    async function loadData() {
      try {
        const dataRes = await fetch('data.json?t=' + Date.now());
        data = await dataRes.json();
      } catch (e) {
        console.error(e);
      }
      const saved = localStorage.getItem('taxi_drivers');
      if (saved) {
        drivers = JSON.parse(saved);
      } else {
        try {
          const driversRes = await fetch('drivers.json?t=' + Date.now());
          const driversData = await driversRes.json();
          drivers = driversData.drivers || {};
        } catch (e) {
          drivers = {};
        }
      }
    }

    function saveToStorage() {
      localStorage.setItem('taxi_drivers', JSON.stringify(drivers));
    }

    function generatePassword() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let pw = '';
      for (let i = 0; i < 6; i++) pw += chars[Math.floor(Math.random() * chars.length)];
      return pw;
    }

    function getAllDrivers() {
      const ids = new Set();
      (data.shifts || []).forEach(s => { if (s.forar) ids.add(s.forar); });
      (data.trips || []).forEach(t => { if (t.forar) ids.add(t.forar); });
      return Array.from(ids);
    }

    function getSortedDrivers() {
      const all = getAllDrivers();
      const order = { agare: 0, admin: 1, normal: 2, semester: 3, avslutad: 4 };
      return all.sort((a, b) => {
        const catA = (drivers[a]?.category || 'normal');
        const catB = (drivers[b]?.category || 'normal');
        if (order[catA] !== order[catB]) return order[catA] - order[catB];
        const nameA = drivers[a]?.name || a;
        const nameB = drivers[b]?.name || b;
        return nameA.localeCompare(nameB);
      });
    }

    function getDriverStatus(id) {
      const d = drivers[id];
      if (!d) return 'inactive';
      if (d.category === 'avslutad') return 'inactive';
      if (d.activated && d.expiry && new Date(d.expiry) > new Date()) {
        return d.loggedIn ? 'active' : 'pending';
      }
      return 'inactive';
    }

    function getFirstName(id) {
      const name = drivers[id]?.name || '';
      return name.split(' ')[0] || '';
    }

    function formatSEK(n) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(n || 0)) + ' kr';
    }

    function parseAmount(str) {
      return parseFloat((str || '0').replace(/\s/g, '').replace(',', '.')) || 0;
    }

    function exportData() {
      const blob = new Blob([JSON.stringify({ drivers }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'drivers.json';
      a.click();
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          drivers = imported.drivers || imported;
          saveToStorage();
          alert('Importerat!');
          render();
        } catch (err) {
          alert('Fel vid import');
        }
      };
      reader.readAsText(file);
    }

    function render() {
      const content = document.getElementById('content');
      const title = document.getElementById('title');
      const back = document.getElementById('back');
      const toggle = document.getElementById('toggle-view');

      toggle.textContent = view === 'grid' ? 'Lista' : 'Ikoner';
      toggle.classList.toggle('active', view === 'list');

      if (current === 'chaufforer') {
        title.textContent = 'Chaufförer';
        back.classList.remove('hidden');
        const sorted = getSortedDrivers();
        let lastCat = null;
        let html = '<div class="section">';
        sorted.forEach(id => {
          const d = drivers[id] || {};
          const cat = d.category || 'normal';
          if (cat !== lastCat) {
            html += `<div class="section-header">${categories[cat] || cat}</div>`;
            lastCat = cat;
          }
          const status = getDriverStatus(id);
          const statusLabel = status === 'active' ? 'Aktiv' : status === 'pending' ? 'Väntar' : 'Inaktiv';
          const firstName = getFirstName(id);
          html += `<div class="driver-row cat-${cat}">
            <span class="driver-id" onclick="editDriver('${id}')" style="cursor:pointer;">${id}</span>
            <span class="driver-name" onclick="editDriver('${id}')" style="cursor:pointer; flex:1;">${firstName}</span>
            <span class="driver-status status-${status}">${statusLabel}</span>
            ${status === 'inactive' && cat !== 'avslutad' ? `<button class="btn-small" onclick="activateDriver('${id}')">Aktivera</button>` : ''}
            ${status !== 'inactive' ? `<button class="btn-small" onclick="deactivateDriver('${id}')">Avaktivera</button>` : ''}
          </div>`;
        });
        html += '</div>';
        content.innerHTML = html;
      } else if (current === 'edit') {
        title.textContent = 'Redigera ' + selectedDriver;
        back.classList.remove('hidden');
        const d = drivers[selectedDriver] || {};
        content.innerHTML = `<div class="section">
          <div class="form-group"><label>Namn</label><input id="f-name" value="${d.name || ''}"></div>
          <div class="form-group"><label>Adress</label><input id="f-address" value="${d.address || ''}"></div>
          <div class="form-group"><label>E-post</label><input id="f-email" type="email" value="${d.email || ''}"></div>
          <div class="form-group"><label>Telefon</label><input id="f-phone" value="${d.phone || ''}"></div>
          <div class="form-group"><label>Kategori</label>
            <select id="f-category">
              ${Object.entries(categories).map(([k, v]) => `<option value="${k}" ${d.category === k ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label>Anteckningar</label><textarea id="f-notes">${d.notes || ''}</textarea></div>
          <button onclick="saveDriver()" style="width:100%;">Spara</button>
        </div>`;
      } else if (current === 'activate') {
        title.textContent = 'Aktivera ' + selectedDriver;
        back.classList.remove('hidden');
        if (!tempPassword) tempPassword = generatePassword();
        content.innerHTML = `<div class="section">
          <div class="password-box">
            <p style="margin-bottom:8px;">Tillfälligt lösenord:</p>
            <code>${tempPassword}</code>
            <div style="margin-top:16px; display:flex; gap:8px; justify-content:center;">
              <button onclick="sharePassword()">Dela</button>
              <button onclick="confirmActivation()">Bekräfta</button>
            </div>
          </div>
          <p style="margin-top:12px; font-size:14px; color:#718096; text-align:center;">Gäller i 24 timmar</p>
        </div>`;
      } else if (current === 'data') {
        title.textContent = 'Data';
        back.classList.remove('hidden');
        content.innerHTML = `<div class="section">
          <p style="margin-bottom:12px;">Data sparas i webbläsaren. Exportera för att spara på annan enhet.</p>
          <div class="data-btns">
            <button onclick="exportData()">Exportera</button>
            <button onclick="document.getElementById('import-file').click()">Importera</button>
          </div>
        </div>`;
      } else if (current === 'oversikt') {
        title.textContent = 'Översikt';
        back.classList.remove('hidden');
        const allDrivers = getAllDrivers();
        const active = allDrivers.filter(id => getDriverStatus(id) === 'active').length;
        const pending = allDrivers.filter(id => getDriverStatus(id) === 'pending').length;
        const inactive = allDrivers.filter(id => getDriverStatus(id) === 'inactive').length;
        content.innerHTML = `<div class="section">
          <div class="driver-row"><span>Aktiva</span><span>${active}</span></div>
          <div class="driver-row"><span>Väntande</span><span>${pending}</span></div>
          <div class="driver-row"><span>Inaktiva</span><span>${inactive}</span></div>
          <div class="driver-row"><span>Totalt</span><span>${allDrivers.length}</span></div>
        </div>`;
      } else if (current === 'statistik') {
        title.textContent = 'Statistik';
        back.classList.remove('hidden');
        const allTrips = (data.trips || []).filter(t => t.kredittyp !== '999');
        const total = allTrips.reduce((s, t) => s + parseAmount(t.belopp), 0);
        content.innerHTML = `<div class="section">
          <div class="driver-row"><span>Antal chaufförer</span><span>${getAllDrivers().length}</span></div>
          <div class="driver-row"><span>Antal körningar</span><span>${allTrips.length}</span></div>
          <div class="driver-row"><span>Totalt inkört</span><span>${formatSEK(total)}</span></div>
        </div>`;
      } else {
        title.textContent = 'Admin';
        back.classList.add('hidden');
        if (view === 'grid') {
          content.innerHTML = `<div class="grid">${menu.map(m => `
            <div class="icon" onclick="openMenu('${m.id}')">
              <div class="emoji">${m.icon}</div>
              <div class="label">${m.label}</div>
            </div>
          `).join('')}</div>`;
        } else {
          content.innerHTML = menu.map(m => `
            <div class="list-item">
              <div class="list-row" onclick="openMenu('${m.id}')">
                <span style="font-size:20px;">${m.icon}</span>
                <span>${m.label}</span>
              </div>
            </div>
          `).join('');
        }
      }
    }

    function openMenu(id) { current = id; tempPassword = null; render(); }
    function goHome() { current = null; tempPassword = null; render(); }
    function goBack() { current = null; tempPassword = null; render(); }
    function toggleView() {
      view = view === 'grid' ? 'list' : 'grid';
      localStorage.setItem('admin_view', view);
      render();
    }

    function editDriver(id) {
      selectedDriver = id;
      current = 'edit';
      render();
    }

    function saveDriver() {
      if (!drivers[selectedDriver]) drivers[selectedDriver] = {};
      drivers[selectedDriver].name = document.getElementById('f-name').value;
      drivers[selectedDriver].address = document.getElementById('f-address').value;
      drivers[selectedDriver].email = document.getElementById('f-email').value;
      drivers[selectedDriver].phone = document.getElementById('f-phone').value;
      drivers[selectedDriver].category = document.getElementById('f-category').value;
      drivers[selectedDriver].notes = document.getElementById('f-notes').value;
      if (drivers[selectedDriver].category === 'avslutad') {
        drivers[selectedDriver].activated = false;
      }
      saveToStorage();
      alert('Sparat!');
      current = 'chaufforer';
      render();
    }

    function activateDriver(id) {
      selectedDriver = id;
      tempPassword = generatePassword();
      current = 'activate';
      render();
    }

    function deactivateDriver(id) {
      if (confirm('Avaktivera ' + id + '?')) {
        if (drivers[id]) drivers[id].activated = false;
        saveToStorage();
        render();
      }
    }

    function confirmActivation() {
      const expiry = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
      if (!drivers[selectedDriver]) drivers[selectedDriver] = {};
      drivers[selectedDriver].password = tempPassword;
      drivers[selectedDriver].expiry = expiry;
      drivers[selectedDriver].activated = true;
      drivers[selectedDriver].loggedIn = false;
      saveToStorage();
      alert('Aktiverad!\nLösenord: ' + tempPassword);
      current = 'chaufforer';
      tempPassword = null;
      render();
    }

    function sharePassword() {
      const url = window.location.origin + '/index.html';
      const text = `TaxiData\n\nLogga in: ${url}\nFöar-ID: ${selectedDriver}\nLösenord: ${tempPassword}\n\nLogga in inom 24 timmar, annars inaktiveras kontot.`;
      if (navigator.share) {
        navigator.share({ title: 'TaxiData', text });
      } else {
        navigator.clipboard.writeText(text);
        alert('Kopierat!');
      }
    }

    document.getElementById('home').onclick = goHome;
    document.getElementById('back').onclick = goBack;
    document.getElementById('toggle-view').onclick = toggleView;
    document.getElementById('import-file').onchange = (e) => {
      if (e.target.files[0]) importData(e.target.files[0]);
    };
    loadData().then(render);
  </script>
</body>
</html>
