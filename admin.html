<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – TaxiData</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #e8f1f8; color: #1a365d; }
    header { background: #e8f1f8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d0e0ea; }
    header h1 { font-size: 18px; flex: 1; }
    button { background: white; border: 2px solid #1a365d; color: #1a365d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1a365d; color: white; }
    button.active { background: #1a365d; color: white; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #content { padding: 16px; max-width: 900px; margin: 0 auto; }
    .section { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .section h2 { font-size: 16px; margin-bottom: 12px; }
    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #edf2f7; }
    .stat-row:last-child { border-bottom: none; }
    .driver-row { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; gap: 12px; }
    .driver-row:last-child { border-bottom: none; }
    .driver-id { font-weight: 600; flex: 1; }
    .driver-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .status-active { background: #c6f6d5; color: #276749; }
    .status-inactive { background: #fed7d7; color: #c53030; }
    .status-pending { background: #fefcbf; color: #975a16; }
    .btn-small { padding: 4px 8px; font-size: 12px; }
    .password-box { background: #f7fafc; padding: 12px; border-radius: 8px; margin-top: 12px; }
    .password-box code { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .share-btns { display: flex; gap: 8px; margin-top: 8px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; max-width: 400px; width: 90%; }
    .modal h3 { margin-bottom: 16px; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { padding: 8px 16px; border-radius: 20px; }
  </style>
</head>
<body>
  <header>
    <button id="back" class="hidden" onclick="goBack()">←</button>
    <h1 id="title">Admin</h1>
    <button onclick="location.href='index.html'">Chaufförvy</button>
  </header>
  <div id="content"></div>

  <script>
    const ADMIN_PASSWORD = 'admin2026';
    let data = {};
    let drivers = {};
    let view = 'menu';
    let selectedDriver = null;
    let currentTab = 'dag';

    async function loadData() {
      const [dataRes, driversRes] = await Promise.all([
        fetch('data.json?t=' + Date.now()),
        fetch('drivers.json?t=' + Date.now())
      ]);
      data = await dataRes.json();
      const driversData = await driversRes.json();
      drivers = driversData.drivers || {};
    }

    function generatePassword() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let pw = '';
      for (let i = 0; i < 6; i++) pw += chars[Math.floor(Math.random() * chars.length)];
      return pw;
    }

    function getAllDrivers() {
      const ids = new Set();
      (data.shifts || []).forEach(s => { if (s.forar) ids.add(s.forar); });
      (data.trips || []).forEach(t => { if (t.forar) ids.add(t.forar); });
      return Array.from(ids).sort();
    }

    function getDriverStatus(id) {
      const d = drivers[id];
      if (!d) return 'inactive';
      if (d.activated && d.expiry && new Date(d.expiry) > new Date()) {
        return d.loggedIn ? 'active' : 'pending';
      }
      return 'inactive';
    }

    function formatSEK(n) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(n || 0)) + ' kr';
    }

    function parseAmount(str) {
      return parseFloat((str || '0').replace(/\s/g, '').replace(',', '.')) || 0;
    }

    function render() {
      const content = document.getElementById('content');
      const title = document.getElementById('title');
      const back = document.getElementById('back');

      if (view === 'menu') {
        title.textContent = 'Admin';
        back.classList.add('hidden');
        content.innerHTML = `
          <div class="section">
            <h2>Översikt</h2>
            <div class="stat-row"><span>Aktiva chaufförer</span><span>${getAllDrivers().filter(id => getDriverStatus(id) === 'active').length}</span></div>
            <div class="stat-row"><span>Väntande aktivering</span><span>${getAllDrivers().filter(id => getDriverStatus(id) === 'pending').length}</span></div>
            <div class="stat-row"><span>Inaktiva</span><span>${getAllDrivers().filter(id => getDriverStatus(id) === 'inactive').length}</span></div>
          </div>
          <div class="section">
            <h2>Meny</h2>
            <div class="stat-row" onclick="view='drivers'; render();" style="cursor:pointer;"><span>👥 Chaufförer</span><span>→</span></div>
            <div class="stat-row" onclick="view='stats'; render();" style="cursor:pointer;"><span>📊 Åkeristatistik</span><span>→</span></div>
          </div>`;
      } else if (view === 'drivers') {
        title.textContent = 'Chaufförer';
        back.classList.remove('hidden');
        const allDrivers = getAllDrivers();
        content.innerHTML = `
          <div class="section">
            ${allDrivers.map(id => {
              const status = getDriverStatus(id);
              const statusLabel = status === 'active' ? 'Aktiv' : status === 'pending' ? 'Väntar' : 'Inaktiv';
              const statusClass = 'status-' + status;
              return `<div class="driver-row">
                <span class="driver-id">${id}</span>
                <span class="driver-status ${statusClass}">${statusLabel}</span>
                <button class="btn-small" onclick="viewDriver('${id}')">Visa</button>
                ${status === 'inactive' ? `<button class="btn-small" onclick="activateDriver('${id}')">Aktivera</button>` : ''}
                ${status !== 'inactive' ? `<button class="btn-small" onclick="deactivateDriver('${id}')">Avaktivera</button>` : ''}
              </div>`;
            }).join('')}
          </div>`;
      } else if (view === 'activate') {
        title.textContent = 'Aktivera ' + selectedDriver;
        back.classList.remove('hidden');
        const pw = generatePassword();
        const expiry = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
        content.innerHTML = `
          <div class="section">
            <h2>Tillfälligt lösenord</h2>
            <div class="password-box">
              <code id="temp-pw">${pw}</code>
              <div class="share-btns">
                <button onclick="sharePassword('${selectedDriver}', '${pw}')">Dela</button>
                <button onclick="confirmActivation('${selectedDriver}', '${pw}', '${expiry}')">Bekräfta aktivering</button>
              </div>
            </div>
            <p style="margin-top:12px; font-size:14px; color:#718096;">Lösenordet gäller i 24 timmar. Chauffören måste logga in inom den tiden.</p>
          </div>`;
      } else if (view === 'driver') {
        title.textContent = 'Chaufför ' + selectedDriver;
        back.classList.remove('hidden');
        content.innerHTML = `<div class="section"><p>Visar data för ${selectedDriver}</p><p style="margin-top:8px;"><a href="index.html?driver=${selectedDriver}" target="_blank">Öppna chaufförvy</a></p></div>`;
      } else if (view === 'stats') {
        title.textContent = 'Åkeristatistik';
        back.classList.remove('hidden');
        const allTrips = (data.trips || []).filter(t => t.kredittyp !== '999');
        const total = allTrips.reduce((s, t) => s + parseAmount(t.belopp), 0);
        content.innerHTML = `
          <div class="section">
            <h2>Totalt</h2>
            <div class="stat-row"><span>Antal chaufförer</span><span>${getAllDrivers().length}</span></div>
            <div class="stat-row"><span>Antal körningar</span><span>${allTrips.length}</span></div>
            <div class="stat-row"><span>Totalt inkört</span><span>${formatSEK(total)}</span></div>
          </div>`;
      }
    }

    function viewDriver(id) {
      selectedDriver = id;
      view = 'driver';
      render();
    }

    function activateDriver(id) {
      selectedDriver = id;
      view = 'activate';
      render();
    }

    function deactivateDriver(id) {
      if (confirm('Avaktivera ' + id + '?')) {
        delete drivers[id];
        saveDrivers();
        render();
      }
    }

    function confirmActivation(id, pw, expiry) {
      drivers[id] = { password: pw, expiry: expiry, activated: true, loggedIn: false };
      saveDrivers();
      alert('Aktiverad! Lösenord: ' + pw);
      view = 'drivers';
      render();
    }

    function sharePassword(id, pw) {
      const url = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');
      const text = `TaxiData\nLogga in: ${url}\nFöar-ID: ${id}\nLösenord: ${pw}\n\nLogga in inom 24 timmar, annars inaktiveras kontot.`;
      if (navigator.share) {
        navigator.share({ title: 'TaxiData', text: text });
      } else {
        navigator.clipboard.writeText(text);
        alert('Kopierat till urklipp!');
      }
    }

    async function saveDrivers() {
      const content = JSON.stringify({ drivers }, null, 2);
      console.log('Saving drivers:', content);
    }

    function goBack() {
      if (view === 'activate' || view === 'driver') view = 'drivers';
      else view = 'menu';
      render();
    }

    loadData().then(render);
  </script>
</body>
</html>
