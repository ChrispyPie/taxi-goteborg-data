<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Göteborg – Kördata</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h2>Taxi Göteborg Data</h2>
      <p>Ange masterlösenord</p>
      <input type="password" id="password" placeholder="Lösenord" autofocus>
      <button onclick="checkPassword()">Logga in</button>
      <p id="login-error" style="color:#c53030; display:none;">Fel lösenord</p>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header>
      <h1>Taxi Göteborg – Statistik</h1>
    </header>
    <main id="dashboard"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
