<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxiData</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #e8f1f8; color: #1a365d; min-height: 100vh; }
    header { background: #e8f1f8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d0e0ea; }
    header h1 { font-size: 18px; flex: 1; }
    button { background: white; border: 2px solid #1a365d; color: #1a365d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #content { padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; }
    .icon { background: white; border: 1px solid #cbd5e0; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; }
    .icon .emoji { font-size: 32px; margin-bottom: 8px; }
    .icon .label { font-size: 13px; }
    .section { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: white; padding: 32px; border-radius: 12px; text-align: center; width: 300px; }
    .login-box h2 { margin-bottom: 16px; }
    .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; }
    .login-box button { width: 100%; padding: 10px; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h2>TaxiData</h2>
      <input type="text" id="driver-id" placeholder="Förar-ID" autofocus>
      <input type="password" id="password" placeholder="Lösenord">
      <button id="login-btn" onclick="checkPassword();">Logga in</button>
      <p id="login-error" style="color:#c53030; display:none; margin-top:8px;"></p>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header>
      <button id="back" style="display:none;">←</button>
      <button id="home">🏠</button>
      <h1 id="title">TaxiData</h1>
      <span id="driver-label"></span>
      <button id="toggle-view">Lista</button>
      <button id="logout">Logga ut</button>
    </header>
    <div id="content">Laddar...</div>
  </div>

  <script>
    var MASTER_PASSWORD = 'taxi2026';
    var menu = [
      { id: 'kordata', icon: '🚗', label: 'Körpassdata' },
      { id: 'statistik', icon: '📊', label: 'Statistik' },
      { id: 'toplistor', icon: '🏆', label: 'Toplistor' },
      { id: 'kommunikation', icon: '💬', label: 'Kommunikation' },
      { id: 'kalender', icon: '📅', label: 'Kalender' },
      { id: 'installningar', icon: '⚙️', label: 'Inställningar' }
    ];

    var view = 'grid';
    var current = null;
    var driverId = null;

    function checkPassword() {
      var id = document.getElementById('driver-id').value;
      var pw = document.getElementById('password').value;
      if (pw === MASTER_PASSWORD) {
        localStorage.setItem('taxi_logged_in', '1');
        localStorage.setItem('taxi_driver', id);
        location.reload();
      } else {
        document.getElementById('login-error').textContent = 'Fel lösenord';
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function showApp() {
      driverId = localStorage.getItem('taxi_driver') || 'okänd';
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('driver-label').textContent = driverId;
      render();
    }

    function logout() {
      localStorage.removeItem('taxi_logged_in');
      localStorage.removeItem('taxi_driver');
      location.reload();
    }

    function render() {
      var content = document.getElementById('content');
      var title = document.getElementById('title');
      var back = document.getElementById('back');

      if (current) {
        title.textContent = current;
        back.style.display = 'inline-block';
        content.innerHTML = '<div class="section"><p>Kommer snart: ' + current + '</p></div>';
      } else {
        title.textContent = 'TaxiData';
        back.style.display = 'none';
        var html = '<div class="grid">';
        for (var i = 0; i < menu.length; i++) {
          html += '<div class="icon" onclick="openItem(\'' + menu[i].id + '\')">';
          html += '<div class="emoji">' + menu[i].icon + '</div>';
          html += '<div class="label">' + menu[i].label + '</div></div>';
        }
        html += '</div>';
        content.innerHTML = html;
      }
    }

    function openItem(id) {
      current = id;
      render();
    }

    function goHome() {
      current = null;
      render();
    }

    document.getElementById('home').onclick = goHome;
    document.getElementById('back').onclick = goHome;
    document.getElementById('logout').onclick = logout;

    if (localStorage.getItem('taxi_logged_in') === '1') {
      showApp();
    }
  </script>
</body>
</html>
