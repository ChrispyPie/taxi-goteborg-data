<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Göteborg – Kördata</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h2>Taxi Göteborg Data</h2>
      <p>Ange masterlösenord</p>
      <input type="password" id="password" placeholder="Lösenord">
      <button onclick="checkPassword()">Logga in</button>
      <p id="login-error" style="color:#c53030; display:none;">Fel lösenord</p>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header>
      <h1>Taxi Göteborg – Min statistik</h1>
      <div class="driver-select">
        <label for="driver">Välj chaufför (demo):</label>
        <select id="driver">
          <option value="15201">15201 – Christian</option>
          <option value="15202">15202 – Erik</option>
          <option value="15203">15203 – Anna</option>
          <option value="admin">Admin (översikt)</option>
        </select>
      </div>
    </header>

    <main id="dashboard">
      <!-- Content filled by script.js -->
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
