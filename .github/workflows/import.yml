name: Import Monthly

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to import (YYYY-MM)'
        required: true
        default: '2026-09'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install playwright && playwright install chromium --with-deps
      
      - name: Run import
        env:
          STIG_USERNAME: ${{ secrets.STIG_USERNAME }}
          STIG_PASSWORD: ${{ secrets.STIG_PASSWORD }}
          IMPORT_MONTH: ${{ inputs.month }}
        run: python import_monthly.py
      
      - name: Commit to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Import ${{ inputs.month }}" || echo "No changes"
          git push origin main
      
      - name: Copy to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- data.json
          git add data.json
          git commit -m "Import ${{ inputs.month }}" || echo "No changes"
          git push origin gh-pages