name: Import Monthly

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to import (YYYY-MM)'
        required: true
        default: '2026-09'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install playwright && playwright install chromium --with-deps
      
      - name: Run import
        env:
          STIG_USERNAME: ${{ secrets.STIG_USERNAME }}
          STIG_PASSWORD: ${{ secrets.STIG_PASSWORD }}
          IMPORT_MONTH: ${{ inputs.month }}
        run: python import_monthly.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Import ${{ inputs.month }}" || echo "No changes"
          git push
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- data.json
          git add data.json
          git commit -m "Import ${{ inputs.month }}" || echo "No changes"
          git push origin gh-pages

      - name: Synka data.json till Supabase
        # Gör inget om SUPABASE_SERVICE_KEY inte finns ännu. Fel här stoppar inte scrapern.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          git show main:data.json > "$RUNNER_TEMP/data.json" 2>/dev/null || cp data.json "$RUNNER_TEMP/data.json"
          git show main:sync_supabase.py > "$RUNNER_TEMP/sync_supabase.py" 2>/dev/null || cp sync_supabase.py "$RUNNER_TEMP/sync_supabase.py"
          python3 "$RUNNER_TEMP/sync_supabase.py" "$RUNNER_TEMP/data.json=current"
