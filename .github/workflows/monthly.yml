name: Monthly correction scrape

on:
  schedule:
    - cron: '10 13 1 * *'  # 1:a varje månad kl 13:10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trip-data
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Hämta data från Supabase
        id: pull
        # data.json finns inte längre i repot; den senaste versionen hämtas från Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync_supabase.py --pull current data.json

      - name: Run monthly correction
        id: scrape
        env:
          TZ: Europe/Stockholm
          STIG_USERNAME: ${{ secrets.STIG_USERNAME }}
          STIG_PASSWORD: ${{ secrets.STIG_PASSWORD }}
        run: python monthly_correct.py

      - name: Spara data till Supabase
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync_supabase.py data.json=current

      - name: Spara kopia av data.json (artefakt, 30 dagar)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: data-json-${{ github.run_id }}
          path: data.json
          retention-days: 30
          if-no-files-found: ignore
