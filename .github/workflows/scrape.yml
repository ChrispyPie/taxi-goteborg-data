name: Scrape STIG data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Från datum (YYYY-MM-DD, tom = igår)'
        required: false
        default: ''
      to_date:
        description: 'Till datum (YYYY-MM-DD, tom = idag)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape-stig
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Schemalagda körningar max 30 min; manuella (backfill) får 90 min
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run scraper
        env:
          STIG_USERNAME: ${{ secrets.STIG_USERNAME }}
          STIG_PASSWORD: ${{ secrets.STIG_PASSWORD }}
          SCRAPE_FROM: ${{ github.event.inputs.from_date }}
          SCRAPE_TO: ${{ github.event.inputs.to_date }}
        run: python scraper.py

      - name: Commit updated data
        # Körs även om scrapern rapporterade fel, så att redan sparade resor inte går förlorade
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json || true
          git diff --staged --quiet || git commit -m "Update data from STIG [skip ci]"
          git push || true

      - name: Copy data to gh-pages
        if: ${{ !cancelled() }}
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout main -- data.json
          git add data.json
          git diff --staged --quiet || git commit -m "Update data from scrape [skip ci]"
          git push origin gh-pages || true
          git checkout main