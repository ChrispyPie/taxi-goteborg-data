name: Scrape STIG data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Från datum (YYYY-MM-DD, tom = igår)'
        required: false
        default: ''
      to_date:
        description: 'Till datum (YYYY-MM-DD, tom = idag)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trip-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Schemalagda körningar max 30 min; manuella (backfill) får 90 min
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Hämta data från Supabase
        id: pull
        # data.json finns inte längre i repot; den senaste versionen hämtas från Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync_supabase.py --pull current data.json

      - name: Run scraper
        id: scrape
        env:
          TZ: Europe/Stockholm
          STIG_USERNAME: ${{ secrets.STIG_USERNAME }}
          STIG_PASSWORD: ${{ secrets.STIG_PASSWORD }}
          SCRAPE_FROM: ${{ github.event.inputs.from_date }}
          SCRAPE_TO: ${{ github.event.inputs.to_date }}
        run: python scraper.py

      - name: Rapportera serverstatus
        if: ${{ !cancelled() && steps.scrape.outcome != 'skipped' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync_supabase.py --status scrape_status.json ${{ steps.scrape.outcome == 'failure' && '--failed' || '' }}

      - name: Spara data till Supabase
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync_supabase.py data.json=current

      - name: Spara kopia av data.json (artefakt, 30 dagar)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: data-json-${{ github.run_id }}
          path: data.json
          retention-days: 30
          if-no-files-found: ignore
