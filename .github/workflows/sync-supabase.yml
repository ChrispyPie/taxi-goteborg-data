name: Synka till Supabase

# Kör manuellt (Actions -> "Synka till Supabase" -> Run workflow) när
# SUPABASE_SERVICE_KEY har lagts in. Läser in data.json (main) samt
# data-*.json och monthly/data-*.json från gh-pages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Hämta gh-pages
        run: |
          git fetch --depth=1 origin gh-pages
          mkdir -p "$RUNNER_TEMP/pages"
          git --work-tree="$RUNNER_TEMP/pages" checkout origin/gh-pages -- . 
          git reset -q
      - name: Synka
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::Secret SUPABASE_SERVICE_KEY saknas"; exit 1; fi
          cd "$RUNNER_TEMP/pages"
          files=$(ls data-*.json monthly/data-*.json 2>/dev/null || true)
          python3 "$GITHUB_WORKSPACE/sync_supabase.py" "$GITHUB_WORKSPACE/data.json=current" $files
