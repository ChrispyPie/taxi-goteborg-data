name: Update shift km

on:
  workflow_dispatch:
    inputs:
      from_day:
        description: 'Från dag (1-31)'
        required: true
        default: '1'
      to_day:
        description: 'Till dag (1-31)'
        required: true
        default: '18'

permissions:
  contents: read

concurrency:
  group: trip-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
      - name: Hämta data från Supabase
        id: pull
        # data.json finns inte längre i repot; den senaste versionen hämtas från Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync_supabase.py --pull current data.json

      - name: Update km
        id: scrape
        env:
          TZ: Europe/Stockholm
          STIG_USERNAME: ${{ secrets.STIG_USERNAME }}
          STIG_PASSWORD: ${{ secrets.STIG_PASSWORD }}
          FROM_DAY: ${{ inputs.from_day }}
          TO_DAY: ${{ inputs.to_day }}
        run: python update_km.py

      - name: Spara data till Supabase
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync_supabase.py data.json=current

      - name: Spara kopia av data.json (artefakt, 30 dagar)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: data-json-${{ github.run_id }}
          path: data.json
          retention-days: 30
          if-no-files-found: ignore
