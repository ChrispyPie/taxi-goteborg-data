name: Update shift km

on:
  workflow_dispatch:
    inputs:
      from_day:
        description: 'Från dag (1-31)'
        required: true
        default: '1'
      to_day:
        description: 'Till dag (1-31)'
        required: true
        default: '18'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
      - name: Update km
        env:
          STIG_USERNAME: ${{ secrets.STIG_USERNAME }}
          STIG_PASSWORD: ${{ secrets.STIG_PASSWORD }}
          FROM_DAY: ${{ inputs.from_day }}
          TO_DAY: ${{ inputs.to_day }}
        run: python update_km.py
      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update shift km"
          git push

      - name: Synka data.json till Supabase
        # Gör inget om SUPABASE_SERVICE_KEY inte finns ännu. Fel här stoppar inte scrapern.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          git show main:data.json > "$RUNNER_TEMP/data.json" 2>/dev/null || cp data.json "$RUNNER_TEMP/data.json"
          git show main:sync_supabase.py > "$RUNNER_TEMP/sync_supabase.py" 2>/dev/null || cp sync_supabase.py "$RUNNER_TEMP/sync_supabase.py"
          python3 "$RUNNER_TEMP/sync_supabase.py" "$RUNNER_TEMP/data.json=current"
